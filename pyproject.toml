[project]
name = "ai-job-hunter"
version = "0.1.0"
description = "A grounded, human-in-the-loop job discovery and application workflow."
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

